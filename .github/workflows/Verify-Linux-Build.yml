name: Verify Linux Build

# Linux 编译验证。Test.yml 只覆盖 Windows/macOS，
# 而 Linux AppImage 是本项目的主要产出，因此单独提供一条验证链路。
#
# 重点验证：
#   1. Kotlin 代码可编译（含日语支持新增的分词器、词典、语法匹配与界面）
#   2. buildJapaneseDictionary 任务能生成 jadic.db
#   3. 日语词库与语法库被打包进运行时目录

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Linux Runtime
    runs-on: ubuntu-22.04
    env:
      GRADLE_OPTS: "-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/gradle-build-action@v3

      - name: Set execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # python3 用于生成日→中词典 jadic.db
          sudo apt-get install -y python3

      - name: Build runtime (compiles Kotlin)
        # createDistributable 会依次触发 decompressDictionary -> buildJapaneseDictionary
        # -> compileKotlin，因此这里同时验证了词典生成与 Kotlin 编译。
        run: ./gradlew createDistributable

      - name: Verify Japanese dictionary generated
        run: |
          set -e
          ls -la resources/common/dictionary/jadic.db
          python3 - <<'EOF'
          import sqlite3
          c = sqlite3.connect('resources/common/dictionary/jadic.db')
          n = c.execute('SELECT COUNT(*) FROM jmdict').fetchone()[0]
          assert n > 0, 'jadic.db 为空'
          print(f'jadic.db 记录数: {n}')
          print(c.execute("SELECT * FROM jmdict WHERE word='食べる'").fetchone())
          EOF

      - name: Verify Japanese vocabularies and grammar packaged
        run: |
          set -e
          APP_DIR="build/compose/binaries/main/app"
          INNER=$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          RES="$INNER/resources"
          echo "运行时资源目录: $RES"
          for d in "JLPT日语" "标准日本语" "みんなの日本語" "JLPT精选" "日语语法"; do
            found=$(find "$RES" -type d -name "$d" | head -n 1)
            if [ -z "$found" ]; then
              echo "::error::缺少词库目录 $d"
              exit 1
            fi
            count=$(find "$found" -name '*.json' | wc -l)
            echo "✓ $d : $count 个文件"
            [ "$count" -gt 0 ] || { echo "::error::$d 为空"; exit 1; }
          done

      - name: Verify Kuromoji packaged
        run: |
          set -e
          APP_DIR="build/compose/binaries/main/app"
          INNER=$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          ls "$INNER"/lib/app/ | grep -i kuromoji || {
            echo "::error::运行库中未找到 kuromoji jar"
            ls "$INNER"/lib/app/ | head -30
            exit 1
          }
          echo "✓ kuromoji 已打包"

      - name: Verify English vocabularies untouched
        run: |
          set -e
          APP_DIR="build/compose/binaries/main/app"
          INNER=$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          RES="$INNER/resources"
          # 英语词库必须原样存在，确认日语改造没有影响既有功能
          for d in "大学英语" "人教版英语" "牛津核心词" "商务英语"; do
            found=$(find "$RES" -type d -name "$d" | head -n 1)
            [ -n "$found" ] || { echo "::error::英语词库 $d 丢失"; exit 1; }
            echo "✓ 英语词库 $d 存在"
          done

      - name: Upload runtime tree
        uses: actions/upload-artifact@v4
        with:
          name: linux-runtime-check
          path: build/compose/binaries/main/app
          retention-days: 3
