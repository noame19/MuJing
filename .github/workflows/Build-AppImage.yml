name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          tags: true

      - name: Set execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxext6 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libxrandr2 \
            libxinerama1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            ffmpeg \
            libsecret-1-0 \
            libgtk-3-0 \
            unzip \
            wget \
            file \
            zsync

      - name: Build Rust JNI library (rust-zstd-jni)
        run: |
          # Install Rust toolchain (needed by Gradle's buildRustZstdJni task)
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          cargo --version
          rustc --version

      - name: Clone and Publish FileKit locally
        run: |
          git clone https://github.com/tangshimin/FileKit.git
          cd FileKit
          chmod +x ./gradlew
          ./gradlew :filekit-core:publishJvmPublicationToMavenLocal \
                     :filekit-dialogs:publishJvmPublicationToMavenLocal \
                     :filekit-dialogs-compose:publishJvmPublicationToMavenLocal \
                     -x jvmTest
          cd ..

      - name: Build Linux Runtime (tar.gz)
        # The JetBrains Compose plugin generates `createDistributable` for the
        # application module. It produces a self-contained tar.gz at
        # build/compose/binaries/main/<packageName>-<version>.tar.gz
        run: ./gradlew createDistributable

      - name: Locate runtime tar.gz
        id: locate
        run: |
          set -euo pipefail
          RUNTIME=$(find build/compose/binaries/main -type f -name '*.tar.gz' | head -n 1 || true)
          if [ -z "${RUNTIME:-}" ]; then
            echo "::error::Compose Desktop runtime tar.gz was not produced by createDistributable."
            ls -la build/compose/binaries/main 2>/dev/null || true
            exit 1
          fi
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "Found runtime: $RUNTIME"

      - name: Verify ffmpeg is present in runtime
        run: |
          set -euo pipefail
          RUNTIME="${{ steps.locate.outputs.runtime }}"
          EXTRACT_DIR="runtime-extracted"
          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"
          tar -xzf "$RUNTIME" -C "$EXTRACT_DIR"
          echo "Runtime contents:"
          ls -la "$EXTRACT_DIR"
          echo "App contents:"
          ls -la "$EXTRACT_DIR"/*/ 2>/dev/null || ls -la "$EXTRACT_DIR"

      - name: Download linuxdeploy and Qt/Wayland plugins
        run: |
          set -euo pipefail
          mkdir -p tools
          cd tools
          # linuxdeploy static binary
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -O linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          # linuxdeploy Qt plugin (handles platforms/, libqxcb.so, libqwayland-*.so)
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
            -O linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          # linuxdeploy GTK plugin (themes & icons for GTK apps)
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk-x86_64.AppImage \
            -O linuxdeploy-plugin-gtk-x86_64.AppImage
          chmod +x linuxdeploy-plugin-gtk-x86_64.AppImage
          cd ..
          ls -la tools

      - name: Prepare AppDir
        run: |
          set -euo pipefail
          RUNTIME="${{ steps.locate.outputs.runtime }}"
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          # Extract runtime into AppDir
          tar -xzf "$RUNTIME" -C "$APPDIR"
          echo "Extracted layout:"
          ls -la "$APPDIR"
          # Rename inner folder to a stable name expected by the runtime launcher.
          # Compose Desktop puts the launcher at <AppDir>/<packageName>/bin/<packageName>
          # In this project, packageName is "幕境" (Chinese). Use a stable alias folder.
          cd "$APPDIR"
          INNER=$(ls -d */ | head -n 1 | tr -d '/')
          echo "Inner folder detected: $INNER"
          # Ensure consistent launcher name
          if [ -d "$INNER" ]; then
            if [ "$INNER" != "MuJing" ]; then
              mv "$INNER" "MuJing"
              INNER="MuJing"
            fi
            # Compose Desktop tarball already ships its own AppRun-style launcher
            # at MuJing/bin/MuJing. We need an AppImage-compatible AppRun that
            # delegates to that launcher so that linuxdeploy plugins can patch
            # the binary before packaging.
            cat > AppRun <<'APPRUN_EOF'
          #!/usr/bin/env bash
          # AppRun wrapper for MuJing AppImage
          # Forward to Compose Desktop launcher; prefer Wayland when available,
          # fall back to X11. This avoids blurry fractional scaling under XWayland.

          set -e

          HERE="$(dirname "$(readlink -f "$0")")"
          LAUNCHER="$HERE/MuJing/bin/MuJing"

          if [ ! -x "$LAUNCHER" ]; then
            echo "MuJing launcher not found at $LAUNCHER" >&2
            exit 1
          fi

          # Prefer Wayland when a Wayland compositor is available, otherwise
          # fall back to X11. Wayland avoids fractional-scaling blur caused
          # by XWayland and matches Qt's preferred platform on KDE Plasma 6.
          if [ -z "${WAYLAND_DISPLAY:-}" ] && [ -n "${XDG_SESSION_TYPE:-}" ] && [ "${XDG_SESSION_TYPE}" = "wayland" ]; then
            export WAYLAND_DISPLAY="${WAYLAND_DISPLAY:-wayland-0}"
          fi

          # Tell Qt / Compose to try Wayland first, then X11 (libxcb).
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"
          export QT_WAYLAND_DISABLE_WINDOWDECORATION="${QT_WAYLAND_DISABLE_WINDOWDECORATION:-1}"
          # Allow running inside Flatpak/Snap-style sandboxes where /tmp is small.
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          exec "$LAUNCHER" "$@"
          APPRUN_EOF
            chmod +x AppRun
          fi
          cd ..
          ls -la "$APPDIR"

      - name: Patch desktop entry and icon
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          # linuxdeploy-plugin-qt expects <APPDIR>/<APPNAME>.desktop
          # and <APPDIR>/<APPNAME>.png as the icon. Ensure both exist.
          cd "$APPDIR"
          if [ ! -f MuJing.desktop ]; then
            cat > MuJing.desktop <<'DESKTOP_EOF'
          [Desktop Entry]
          Type=Application
          Name=幕境 MuJing
          GenericName=Language Learning via Movies
          Comment=Learn English vocabulary through movies, TV shows, and documentaries.
          Exec=AppRun %F
          Icon=MuJing
          Terminal=false
          Categories=Education;Languages;Utility;
          Keywords=English;Vocabulary;Subtitle;Learning;Movie;
          StartupNotify=true
          StartupWMClass=幕境
          DESKTOP_EOF
          fi
          # Copy icon from resources
          if [ -f src/main/resources/logo/logo.png ]; then
            cp src/main/resources/logo/logo.png MuJing.png
          elif [ -f resources/common/logo/logo.svg ]; then
            cp resources/common/logo/logo.svg MuJing.svg
          fi
          ls -la
          cd ..

      - name: Bundle ffmpeg into runtime resources
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          RUNTIME_BIN="$APPDIR/MuJing/bin"
          RUNTIME_RES="$APPDIR/MuJing/resources"
          # Replace the bundled ffmpeg with the host one (it has whisper filter support).
          if [ -f resources/linux/ffmpeg/ffmpeg ]; then
            cp -v resources/linux/ffmpeg/ffmpeg "$RUNTIME_BIN/ffmpeg"
            chmod +x "$RUNTIME_BIN/ffmpeg"
          else
            echo "WARN: bundled resources/linux/ffmpeg/ffmpeg not found, leaving default."
          fi
          # Ensure ffmpeg in resources/linux path the Compose plugin copies
          mkdir -p "$RUNTIME_RES/linux"
          if [ -f resources/linux/ffmpeg/ffmpeg ]; then
            cp -v resources/linux/ffmpeg/ffmpeg "$RUNTIME_RES/linux/ffmpeg" || true
            chmod +x "$RUNTIME_RES/linux/ffmpeg" || true
          fi

      - name: Install Qt/GTK input-method platform plugins
        run: |
          set -euo pipefail
          # Compose Desktop bundles Qt 6 via JetBrains runtime. To support
          # Fcitx5 / IBus natively (recommended by Fedora KDE and Ubuntu),
          # we install the input-method Qt plugins on the build host and
          # rely on the system loader at runtime via QT_IM_MODULE / GTK_IM_MODULE.
          # Inside the AppImage we ALSO bundle the Fcitx5 Qt plugin so the
          # IME works out-of-the-box without host configuration.
          sudo apt-get install -y \
            libfcitx5-qt6-1 \
            libfcitx5-qt6-dev \
            fcitx5-modules \
            fcitx5-frontend-qt5 \
            libqt6gui6 \
            libqt6widgets6 \
            libqt6core6 \
            libqt6dbus6 \
            libibus-1.0-5

      - name: Bundle Fcitx5/IBus Qt platforminputcontext plugins
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          # Locate the Qt 6 plugin directory that ships with the JetBrains
          # Compose runtime. It contains platforms/, platformthemes/, etc.
          QT_PLUGINS_DIR=$(find "$APPDIR" -type d -path '*/lib/runtime/lib/plugins' | head -n 1 || true)
          if [ -z "${QT_PLUGINS_DIR:-}" ]; then
            QT_PLUGINS_DIR=$(find "$APPDIR" -type d -path '*platforms' | head -n 1 || true)
            QT_PLUGINS_DIR="$(dirname "$QT_PLUGINS_DIR" 2>/dev/null || true)"
          fi
          echo "Detected Qt plugins dir: ${QT_PLUGINS_DIR:-<not found>}"
          if [ -z "${QT_PLUGINS_DIR:-}" ]; then
            echo "WARN: Qt plugins dir not found; relying on system Qt plugins at runtime."
          else
            mkdir -p "$QT_PLUGINS_DIR/platforminputcontexts" || true
            # Pull Fcitx5 / IBus Qt6 input-method plugins from the build host.
            for plugin in \
              /usr/lib/x86_64-linux-gnu/qt6/plugins/platforminputcontexts/libfcitx5platforminputcontextplugin.so \
              /usr/lib/x86_64-linux-gnu/qt6/plugins/platforminputcontexts/libibusplatforminputcontextplugin.so; do
              if [ -f "$plugin" ]; then
                echo "Copying $plugin -> $QT_PLUGINS_DIR/platforminputcontexts/"
                cp -v "$plugin" "$QT_PLUGINS_DIR/platforminputcontexts/" || true
              fi
            done
          fi

      - name: Run linuxdeploy (AppImage)
        run: |
          set -euo pipefail
          cd "$(pwd)"
          export DEPLOY_DIR="$(pwd)/AppDir"
          # linuxdeploy will run plugins against the AppDir.
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir "$DEPLOY_DIR" \
            --desktop-file "$DEPLOY_DIR/MuJing.desktop" \
            --icon-file "$DEPLOY_DIR/MuJing.png" \
            --executable "$DEPLOY_DIR/MuJing/bin/MuJing" \
            --output appimage \
            --plugin qt \
            --plugin gtk
          ls -la *.AppImage 2>/dev/null || ls -la MuJing*.AppImage 2>/dev/null || true

      - name: Rename and verify AppImage
        run: |
          set -euo pipefail
          APPIMAGE_PATH=$(find . -maxdepth 2 -name 'MuJing-*.AppImage' -type f | head -n 1 || true)
          if [ -z "${APPIMAGE_PATH:-}" ]; then
            APPIMAGE_PATH=$(find . -maxdepth 2 -name '*.AppImage' -type f | head -n 1 || true)
          fi
          if [ -z "${APPIMAGE_PATH:-}" ]; then
            echo "::error::AppImage not produced by linuxdeploy."
            ls -la
            exit 1
          fi
          echo "AppImage produced at: $APPIMAGE_PATH"
          # Determine version
          VERSION=$(grep '^version=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r\n')
          TARGET="MuJing-${VERSION}-x86_64.AppImage"
          mv -v "$APPIMAGE_PATH" "$TARGET"
          chmod +x "$TARGET"
          ls -la "$TARGET"
          # Quick sanity check: file type and an in-place --appimage-help probe.
          file "$TARGET"
          "$TARGET" --appimage-help 2>&1 | head -n 5 || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuJing-linux-appimage-x86_64
          path: MuJing-*.AppImage

  draft-release:
    name: Draft Release
    needs: appimage
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Get Tag
        id: get_tag
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Draft Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          generateReleaseNotes: false
          name: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ---
            ### Linux 版本下载
            - [Linux AppImage (x86_64)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-x86_64.AppImage)
            ### Windows 版本下载
            - [Windows 安装包 (MSI)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}.msi)
            - [Windows 绿色版 (ZIP)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}.zip)
            ### macOS 版本下载
            - [macOS x86_64 Intel 芯片(DMG)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-x64.dmg)
            - [macOS aarch64 M 芯片(DMG)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-aarch64.dmg)
          artifactErrorsFailBuild: false
          artifacts: "artifacts/**/*.AppImage,artifacts/**/*.msi,artifacts/**/*.zip,artifacts/**/*.dmg"
