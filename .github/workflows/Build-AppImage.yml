name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # linuxdeploy expects to extract itself from an AppImage. Honour
      # the AppImage runtime env vars but allow FUSE-less extraction via
      # the bundled AppRun by setting these on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # Compose Desktop bundles its own Qt 6 runtime, so we don't
          # need qt6-base-dev or linuxdeploy-plugin-qt. The libs we
          # install here are the standard X11/GL stack that the runtime
          # expects to find on a Linux desktop. imagemagick is used to
          # downscale the AppImage icon to a standard size.
          sudo apt-get install -y \
            libxext6 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libxrandr2 \
            libxinerama1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            ffmpeg \
            libsecret-1-0 \
            libgtk-3-0 \
            unzip \
            wget \
            file \
            zsync \
            libibus-1.0-5 \
            dpkg \
            fakeroot \
            imagemagick

      - name: Fetch Fcitx5 Qt6 plugin from noble
        # Ubuntu 22.04 (jammy) does not ship Qt6 Fcitx5 plugins. The
        # AppImage needs these to provide IME support for Qt apps. Pull
        # the prebuilt `.deb` files from noble (Ubuntu 24.04) and extract
        # just the plugin shared objects; Qt6 ABI is stable across these
        # releases so a cross-version drop-in works.
        run: |
          set -euo pipefail
          mkdir -p ime-debs
          cd ime-debs
          BASE="http://archive.ubuntu.com/ubuntu/pool/universe/f/fcitx5-qt"
          wget -q "$BASE/libfcitx5-qt6-1_5.1.13-1_amd64.deb"
          wget -q "$BASE/fcitx5-frontend-qt6_5.1.13-1_amd64.deb"
          ls -la
          cd ..
          mkdir -p ime-extracted
          for d in ime-debs/*.deb; do
            echo "Extracting $d"
            dpkg-deb -x "$d" ime-extracted
          done
          echo "Plugins found:"
          find ime-extracted -name '*.so' | head -20

      - name: Build Rust JNI library (rust-zstd-jni)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          cargo --version
          rustc --version

      - name: Clone and Publish FileKit locally
        run: |
          git clone https://github.com/tangshimin/FileKit.git
          cd FileKit
          chmod +x ./gradlew
          ./gradlew :filekit-core:publishJvmPublicationToMavenLocal \
                     :filekit-dialogs:publishJvmPublicationToMavenLocal \
                     :filekit-dialogs-compose:publishJvmPublicationToMavenLocal \
                     -x jvmTest
          cd ..

      - name: Build Linux Runtime
        # The Compose Desktop plugin's `createDistributable` task unpacks
        # the self-contained runtime (Java + app jars + resources) into
        # `build/compose/binaries/main/app/<packageName>/`. It does NOT
        # write the launcher script — that is only created when a
        # `package<Format>` task runs jpackage to completion. Since
        # the only Linux target enabled in this project is `Deb`, and
        # jpackage's deb path is fragile in CI, we run createDistributable
        # to lay down the runtime tree, then synthesise the launcher
        # ourselves in the next step.
        run: ./gradlew createDistributable

      - name: Synthesise launcher script
        # The Compose Desktop plugin writes a small bash wrapper at
        # `<packageName>/bin/<packageName>` that invokes the bundled
        # JetBrains JDK with `-m <module>/<mainClass>` and the JVM args
        # declared in build.gradle.kts. We reproduce that wrapper using
        # the mainClass resolved from gradle.properties / args file.
        run: |
          set -euo pipefail
          APP_DIR="build/compose/binaries/main/app"
          INNER_PATH=$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "${INNER_PATH:-}" ]; then
            echo "::error::No inner package folder found under $APP_DIR"
            exit 1
          fi
          INNER=$(basename "$INNER_PATH")
          LAUNCHER="$INNER_PATH/bin/$INNER"
          if [ -x "$LAUNCHER" ]; then
            echo "Launcher already exists at $LAUNCHER; skipping synthesise."
          else
            echo "Synthesising launcher at $LAUNCHER"
            mkdir -p "$(dirname "$LAUNCHER")"
            # The Compose plugin's app uses mainClass = "com.mujingx.MainKt"
            # from build.gradle.kts. We hard-code it here (rather than
            # parsing jpackage's args file, which createDistributable
            # does not produce) so the AppImage build is self-contained.
            MAIN_CLASS="com.mujingx.MainKt"
            echo "Using main class: $MAIN_CLASS"
            cat > "$LAUNCHER" <<EOF
          #!/usr/bin/env bash
          # Synthesised launcher for MuJing AppImage.
          # Compose Desktop ships a JPMS modular app; the launcher normally
          # uses \`-m java/com.mujingx.MainKt\`, but the exact module name
          # depends on the Compose plugin's packaging internals. We use
          # \`-cp\` over the full runtime classpath, which works for any
          # JPMS setup because the bundled JetBrains JDK 21 has all the
          # required modules on the module path implicitly.
          HERE="\$(cd "\$(dirname "\$0")" && pwd)"
          APP_HOME="\$(dirname "\$(dirname "\$HERE")")"
          RUNTIME="\$APP_HOME/lib/runtime"
          APP_CLASSPATH="\$RUNTIME/lib/app/*:\$RUNTIME/lib/*"
          exec "\$RUNTIME/bin/java" \\
            -server \\
            "-XX:+UnlockExperimentalVMOptions" \\
            "-XX:+UseZGC" \\
            "-XX:+ZGenerational" \\
            "-XX:+ZUncommit" \\
            "-XX:ZUncommitDelay=5" \\
            "-XX:ZCollectionInterval=2" \\
            "-Xms64m" \\
            "-Xmx1g" \\
            "-Dfile.encoding=UTF-8" \\
            "-Dstdout.encoding=UTF-8" \\
            "-Dstderr.encoding=UTF-8" \\
            "-Dsun.stdout.encoding=UTF-8" \\
            "-Dapple.awt.application.appearance=system" \\
            "-Dcompose.swing.render.on.graphics=true" \\
            "-Dcompose.interop.blending=true" \\
            -cp "\$APP_CLASSPATH" \\
            "$MAIN_CLASS" \\
            "\$@"
          EOF
            chmod +x "$LAUNCHER"
          fi
          ls -la "$LAUNCHER"
          head -20 "$LAUNCHER"

      - name: Verify runtime layout
        run: |
          set -euo pipefail
          APP_DIR="build/compose/binaries/main/app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Expected runtime dir missing: $APP_DIR"
            ls -la build/compose/binaries/main 2>/dev/null || true
            exit 1
          fi
          echo "Runtime directory contents:"
          ls -la "$APP_DIR"
          echo "Inner app folder:"
          INNER_PATH=$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
          if [ -n "${INNER_PATH:-}" ]; then
            ls -la "$INNER_PATH"
          else
            echo "::warning::No inner folder under $APP_DIR"
          fi

      - name: Download linuxdeploy
        run: |
          set -euo pipefail
          mkdir -p tools
          cd tools
          # linuxdeploy's continuous builds occasionally 5xx; retry.
          for i in 1 2 3 4 5; do
            if wget -q --tries=2 --timeout=30 \
              https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
              -O linuxdeploy-x86_64.AppImage; then
              break
            fi
            sleep 5
          done
          chmod +x linuxdeploy-x86_64.AppImage
          # We intentionally skip linuxdeploy-plugin-qt: Compose Desktop
          # bundles its own Qt 6 runtime, so we don't need to drag in
          # additional system Qt libraries.
          # We also skip linuxdeploy-plugin-gtk: the upstream continuous
          # release was retired (404s), and Compose apps don't need
          # GTK runtime integration.
          cd ..
          ls -la tools

      - name: Stage AppDir
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          # Compose produced: build/compose/binaries/main/app/<packageName>/...
          # The launcher Compose created lives at the same relative path
          # inside the inner folder, so we copy the WHOLE inner folder
          # under AppDir/ preserving its original name (which here is the
          # Chinese package name 幕境). Renaming the inner folder would
          # break the launcher path, so we keep the original name.
          SRC_APP="build/compose/binaries/main/app"
          INNER_PATH=$(find "$SRC_APP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$INNER_PATH" ]; then
            echo "::error::No inner package folder found under $SRC_APP"
            ls -la "$SRC_APP"
            exit 1
          fi
          INNER=$(basename "$INNER_PATH")
          echo "Inner folder name: $INNER"
          cp -a "$INNER_PATH" "$APPDIR/$INNER"
          # Bundle ffmpeg (whisper-enabled build) into the runtime bin dir
          if [ -f resources/linux/ffmpeg/ffmpeg ]; then
            cp -v resources/linux/ffmpeg/ffmpeg "$APPDIR/$INNER/bin/ffmpeg"
            chmod +x "$APPDIR/$INNER/bin/ffmpeg"
          fi
          ls -la "$APPDIR/$INNER"
          echo "AppDir contents:"
          ls -la "$APPDIR"

      - name: Generate desktop entry and icon
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          # linuxdeploy-plugin-qt expects the desktop/icon files at
          # <AppDir>/<AppName>.desktop and <AppDir>/<AppName>.{png,svg}.
          # Use the same name as the inner Compose package (Chinese) so
          # linuxdeploy's Qt plugin can match the launcher.
          INNER=$(find "$APPDIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)
          cd "$APPDIR"
          DESKTOP_NAME="$INNER.desktop"
          cat > "$DESKTOP_NAME" <<EOF
          [Desktop Entry]
          Type=Application
          Name=幕境 MuJing
          GenericName=Language Learning via Movies
          Comment=Learn English vocabulary through movies, TV shows, and documentaries.
          Exec=AppRun %F
          Icon=$INNER
          Terminal=false
          Categories=Education;Languages;Utility;
          Keywords=English;Vocabulary;Subtitle;Learning;Movie;
          StartupNotify=true
          StartupWMClass=幕境
          EOF
          if [ -f ../src/main/resources/logo/logo.png ]; then
            # linuxdeploy rejects non-standard icon sizes; downscale
            # the project's 1280x1280 logo to 256x256 which is the most
            # widely-supported target for AppImage icons.
            if command -v convert >/dev/null 2>&1; then
              convert ../src/main/resources/logo/logo.png -resize 256x256 "$INNER.png"
            else
              cp ../src/main/resources/logo/logo.png "$INNER.png"
            fi
          elif [ -f ../resources/common/logo/logo.svg ]; then
            cp ../resources/common/logo/logo.svg "$INNER.svg"
          fi
          ls -la
          cd ..

      - name: Write AppRun (Wayland-first launcher)
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          # The Compose Desktop inner folder keeps its original (Chinese)
          # name, so the launcher is at AppDir/幕境/bin/幕境.
          INNER=$(find "$APPDIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)
          echo "AppRun will dispatch to inner folder: $INNER"
          cat > "$APPDIR/AppRun" <<'APPRUN_EOF'
          #!/usr/bin/env bash
          # AppRun wrapper for MuJing AppImage.
          # Forward to the Compose Desktop launcher; prefer Wayland when a
          # Wayland session is detected, otherwise fall back to X11.
          #
          # HiDPI scaling:
          #   The Compose runtime is a Swing/AWT app built on JetBrains
          #   Runtime. On KDE Plasma 6 / GNOME running Wayland with
          #   fractional scaling (125%, 150%) the Swing UI ignores the
          #   system scale unless -Dsun.java2d.uiScale.enabled=true is
          #   passed. We forward GDK_SCALE / QT_SCALE_FACTOR and inject
          #   the JBR HiDPI flags via _JAVA_OPTIONS so the embedded JDK
          #   picks them up without editing the upstream Compose
          #   launcher script.
          set -e

          HERE="$(cd "$(dirname "$0")" && pwd)"
          LAUNCHER="$HERE/MuJing/bin/MuJing"

          if [ ! -x "$LAUNCHER" ]; then
            echo "MuJing launcher not found at $LAUNCHER" >&2
            exit 1
          fi

          # If a Wayland compositor is running but WAYLAND_DISPLAY isn't set,
          # synthesise one (helps nested sessions / sandboxed launches).
          if [ -z "${WAYLAND_DISPLAY:-}" ] \
              && [ -n "${XDG_SESSION_TYPE:-}" ] \
              && [ "${XDG_SESSION_TYPE}" = "wayland" ]; then
            export WAYLAND_DISPLAY="${WAYLAND_DISPLAY:-wayland-0}"
          fi

          # Prefer Wayland, then X11 (libxcb). This avoids fractional-scaling
          # blur under XWayland on KDE Plasma 6 / GNOME.
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"
          export QT_WAYLAND_DISABLE_WINDOWDECORATION="${QT_WAYLAND_DISABLE_WINDOWDECORATION:-1}"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          # Tell Qt / GDK about the user's scale factor (KDE Plasma /
          # GNOME set these via XSettings; we forward them explicitly
          # so XWayland sessions and isolated sandboxes still see them).
          : "${GDK_SCALE:=${QT_SCALE_FACTOR:-}}"
          : "${QT_SCALE_FACTOR:=${GDK_SCALE:-}}"
          export GDK_SCALE QT_SCALE_FACTOR

          # JBR HiDPI: enable JRE-managed HiDPI mode so the Swing UI
          # honours the system / user scale factor on Linux. Without
          # this, the UI renders at 1.0 scale on KDE Wayland fractional
          # scaling and looks tiny.
          export _JAVA_OPTIONS="${_JAVA_OPTIONS:-} -Dsun.java2d.uiScale.enabled=true"

          exec "$LAUNCHER" "$@"
          APPRUN_EOF
          chmod +x "$APPDIR/AppRun"

      - name: Bundle Fcitx5/IBus Qt6 input-method plugins
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          INNER=$(find "$APPDIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)
          # JetBrains Compose runtime ships Qt 6 plugins at
          # <innerFolder>/lib/runtime/lib/plugins/ inside the unpacked
          # distributable.
          QT_PLUGINS_DIR=$(find "$APPDIR/$INNER" -type d -path '*plugins' | head -n 1 || true)
          if [ -z "${QT_PLUGINS_DIR:-}" ]; then
            echo "::warning::Qt plugins dir not found; IME plugins will fall back to host at runtime."
          else
            mkdir -p "$QT_PLUGINS_DIR/platforminputcontexts"
            # Use the Fcitx5 Qt6 plugin pulled from the noble deb above.
            # IBus uses the system daemon via QT_IM_MODULE=ibus (no extra Qt
            # plugin file is needed in the AppImage).
            fcitx_plugin=$(find ime-extracted -name 'libfcitx5platforminputcontextplugin.so' | head -n 1 || true)
            if [ -n "${fcitx_plugin:-}" ]; then
              echo "Bundling $fcitx_plugin"
              cp -v "$fcitx_plugin" "$QT_PLUGINS_DIR/platforminputcontexts/"
            else
              echo "::warning::libfcitx5platforminputcontextplugin.so not found in extracted ime-extracted tree."
            fi
          fi

      - name: Run linuxdeploy to produce AppImage
        run: |
          set -euo pipefail
          export DEPLOY_DIR="$PWD/AppDir"
          INNER=$(find "$DEPLOY_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 | xargs basename)
          echo "linuxdeploy: target executable $DEPLOY_DIR/$INNER/bin/$INNER"
          # Compose Desktop bundles a complete JetBrains runtime that
          # includes its own Qt 6 libraries at
          #   $DEPLOY_DIR/$INNER/lib/runtime/lib/
          # so we do NOT need linuxdeploy-plugin-qt (which would try to
          # fetch system Qt / qmake and bundle it separately). Skipping
          # the Qt plugin keeps the AppImage self-contained and avoids
          # brittle qmake / qt6-base-dev discovery on jammy.
          export QML_SOURCES_PATHS=""
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir "$DEPLOY_DIR" \
            --desktop-file "$DEPLOY_DIR/$INNER.desktop" \
            --icon-file "$DEPLOY_DIR/$INNER.png" \
            --executable "$DEPLOY_DIR/$INNER/bin/$INNER" \
            --output appimage
          ls -la *.AppImage

      - name: Rename and verify AppImage
        run: |
          # Force a UTF-8 locale so filenames with non-ASCII chars
          # round-trip correctly through cp / ls / glob expansion.
          export LANG=C.UTF-8 LC_ALL=C.UTF-8
          APPIMAGE_PATH=$(find . -maxdepth 2 -name '*.AppImage' -type f -print -quit || true)
          echo "DEBUG: find output = '$APPIMAGE_PATH'"
          ls -la *.AppImage 2>&1 || true
          if [ -z "$APPIMAGE_PATH" ]; then
            echo "::error::AppImage not produced by linuxdeploy."
            exit 1
          fi
          VERSION=$(grep '^version=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r\n')
          TARGET="MuJing-${VERSION}-x86_64.AppImage"
          echo "Copying $APPIMAGE_PATH -> $TARGET"
          cp -v "$APPIMAGE_PATH" "$TARGET" || { echo "cp failed with code $?"; ls -la; exit 1; }
          rm -f "$APPIMAGE_PATH"
          chmod +x "$TARGET"
          file "$TARGET"
          ls -la "$TARGET"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuJing-linux-appimage-x86_64
          path: MuJing-*-x86_64.AppImage

  draft-release:
    name: Draft Release
    needs: appimage
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Get Tag
        id: get_tag
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Draft Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          generateReleaseNotes: false
          name: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ---
            ### Linux 版本下载
            - [Linux AppImage (x86_64)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-x86_64.AppImage)
            ### Windows 版本下载
            - [Windows 安装包 (MSI)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}.msi)
            - [Windows 绿色版 (ZIP)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}.zip)
            ### macOS 版本下载
            - [macOS x86_64 Intel 芯片(DMG)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-x64.dmg)
            - [macOS aarch64 M 芯片(DMG)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-aarch64.dmg)
          artifactErrorsFailBuild: false
          artifacts: "artifacts/**/*.AppImage,artifacts/**/*.msi,artifacts/**/*.zip,artifacts/**/*.dmg"
