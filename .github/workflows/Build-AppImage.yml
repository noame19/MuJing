name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      # linuxdeploy expects to extract itself from an AppImage. Honour
      # the AppImage runtime env vars but allow FUSE-less extraction via
      # the bundled AppRun by setting these on the runner.
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set execute permissions on gradlew
        run: chmod +x ./gradlew

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # Compose Desktop's `packageDeb` invokes jpackage, which needs
          # dpkg + fakeroot on the build host to actually finish packaging
          # (and in doing so materialise the launcher script we depend on).
          sudo apt-get install -y \
            libxext6 \
            libxrender1 \
            libxtst6 \
            libxi6 \
            libxrandr2 \
            libxinerama1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libdbus-1-3 \
            libfontconfig1 \
            libfreetype6 \
            ffmpeg \
            libsecret-1-0 \
            libgtk-3-0 \
            unzip \
            wget \
            file \
            zsync \
            libibus-1.0-5 \
            dpkg \
            fakeroot

      - name: Fetch Fcitx5 Qt6 plugin from noble
        # Ubuntu 22.04 (jammy) does not ship Qt6 Fcitx5 plugins. The
        # AppImage needs these to provide IME support for Qt apps. Pull
        # the prebuilt `.deb` files from noble (Ubuntu 24.04) and extract
        # just the plugin shared objects; Qt6 ABI is stable across these
        # releases so a cross-version drop-in works.
        run: |
          set -euo pipefail
          mkdir -p ime-debs
          cd ime-debs
          BASE="http://archive.ubuntu.com/ubuntu/pool/universe/f/fcitx5-qt"
          wget -q "$BASE/libfcitx5-qt6-1_5.1.13-1_amd64.deb"
          wget -q "$BASE/fcitx5-frontend-qt6_5.1.13-1_amd64.deb"
          ls -la
          cd ..
          mkdir -p ime-extracted
          for d in ime-debs/*.deb; do
            echo "Extracting $d"
            dpkg-deb -x "$d" ime-extracted
          done
          echo "Plugins found:"
          find ime-extracted -name '*.so' | head -20

      - name: Build Rust JNI library (rust-zstd-jni)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
          cargo --version
          rustc --version

      - name: Clone and Publish FileKit locally
        run: |
          git clone https://github.com/tangshimin/FileKit.git
          cd FileKit
          chmod +x ./gradlew
          ./gradlew :filekit-core:publishJvmPublicationToMavenLocal \
                     :filekit-dialogs:publishJvmPublicationToMavenLocal \
                     :filekit-dialogs-compose:publishJvmPublicationToMavenLocal \
                     -x jvmTest
          cd ..

      - name: Build Linux Runtime
        # The Compose Desktop plugin only materialises the launcher script
        # (`<packageName>/bin/<packageName>`) during a `package<Format>`
        # task — `createDistributable` alone leaves `bin/` empty.
        # Run `packageDeb` so the runtime tree is fully assembled, then
        # we treat `build/compose/binaries/main/app/` as the AppDir payload.
        run: ./gradlew packageDeb

      - name: Verify runtime layout
        run: |
          set -euo pipefail
          APP_DIR="build/compose/binaries/main/app"
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Expected runtime dir missing: $APP_DIR"
            ls -la build/compose/binaries/main 2>/dev/null || true
            exit 1
          fi
          echo "Runtime directory contents:"
          ls -la "$APP_DIR"
          echo "Inner app folder:"
          INNER_PATH=$(find "$APP_DIR" -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
          if [ -n "${INNER_PATH:-}" ]; then
            ls -la "$INNER_PATH"
          else
            echo "::warning::No inner folder under $APP_DIR"
          fi

      - name: Download linuxdeploy and plugins
        run: |
          set -euo pipefail
          mkdir -p tools
          cd tools
          # linuxdeploy's continuous builds occasionally 5xx; retry.
          for i in 1 2 3 4 5; do
            if wget -q --tries=2 --timeout=30 \
              https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
              -O linuxdeploy-x86_64.AppImage; then
              break
            fi
            sleep 5
          done
          chmod +x linuxdeploy-x86_64.AppImage
          # The linuxdeploy-plugin-gtk asset has been retired upstream
          # (404 on the continuous release). Compose Desktop is a Qt app,
          # so we only need the Qt plugin — Qt apps already use the
          # system GTK theme/icon via XDG, no GTK runtime is required.
          for i in 1 2 3 4 5; do
            if wget -q --tries=2 --timeout=30 \
              https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage \
              -O linuxdeploy-plugin-qt-x86_64.AppImage; then
              break
            fi
            sleep 5
          done
          chmod +x linuxdeploy-plugin-qt-x86_64.AppImage
          cd ..
          ls -la tools

      - name: Stage AppDir
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"
          # Compose produced: build/compose/binaries/main/app/<packageName>/...
          # Copy the inner package folder directly under AppDir as `MuJing/`
          # so that paths are stable regardless of the original packageName
          # (which may be a Chinese name and not safe for shell expansion).
          SRC_APP="build/compose/binaries/main/app"
          # Use find to safely handle folders whose name contains slashes / spaces.
          INNER_PATH=$(find "$SRC_APP" -mindepth 1 -maxdepth 1 -type d | head -n 1)
          if [ -z "$INNER_PATH" ]; then
            echo "::error::No inner package folder found under $SRC_APP"
            ls -la "$SRC_APP"
            exit 1
          fi
          INNER=$(basename "$INNER_PATH")
          echo "Original inner folder name: $INNER"
          cp -a "$INNER_PATH" "$APPDIR/MuJing"
          # Bundle ffmpeg (whisper-enabled build) into the runtime bin dir
          if [ -f resources/linux/ffmpeg/ffmpeg ]; then
            cp -v resources/linux/ffmpeg/ffmpeg "$APPDIR/MuJing/bin/ffmpeg"
            chmod +x "$APPDIR/MuJing/bin/ffmpeg"
          fi
          ls -la "$APPDIR/MuJing"
          echo "AppDir contents:"
          ls -la "$APPDIR"

      - name: Generate desktop entry and icon
        run: |
          set -euo pipefail
          cd AppDir
          cat > MuJing.desktop <<'DESKTOP_EOF'
          [Desktop Entry]
          Type=Application
          Name=幕境 MuJing
          GenericName=Language Learning via Movies
          Comment=Learn English vocabulary through movies, TV shows, and documentaries.
          Exec=AppRun %F
          Icon=MuJing
          Terminal=false
          Categories=Education;Languages;Utility;
          Keywords=English;Vocabulary;Subtitle;Learning;Movie;
          StartupNotify=true
          StartupWMClass=幕境
          DESKTOP_EOF
          if [ -f ../src/main/resources/logo/logo.png ]; then
            cp ../src/main/resources/logo/logo.png MuJing.png
          elif [ -f ../resources/common/logo/logo.svg ]; then
            cp ../resources/common/logo/logo.svg MuJing.svg
          fi
          ls -la
          cd ..

      - name: Write AppRun (Wayland-first launcher)
        run: |
          set -euo pipefail
          cat > AppDir/AppRun <<'APPRUN_EOF'
          #!/usr/bin/env bash
          # AppRun wrapper for MuJing AppImage.
          # Forward to the Compose Desktop launcher; prefer Wayland when a
          # Wayland session is detected, otherwise fall back to X11.
          set -e

          HERE="$(dirname "$(readlink -f "$0")")"
          LAUNCHER="$HERE/MuJing/bin/MuJing"

          if [ ! -x "$LAUNCHER" ]; then
            echo "MuJing launcher not found at $LAUNCHER" >&2
            exit 1
          fi

          # If a Wayland compositor is running but WAYLAND_DISPLAY isn't set,
          # synthesise one (helps nested sessions / sandboxed launches).
          if [ -z "${WAYLAND_DISPLAY:-}" ] \
              && [ -n "${XDG_SESSION_TYPE:-}" ] \
              && [ "${XDG_SESSION_TYPE}" = "wayland" ]; then
            export WAYLAND_DISPLAY="${WAYLAND_DISPLAY:-wayland-0}"
          fi

          # Prefer Wayland, then X11 (libxcb). This avoids fractional-scaling
          # blur under XWayland on KDE Plasma 6 / GNOME.
          export QT_QPA_PLATFORM="${QT_QPA_PLATFORM:-wayland;xcb}"
          export QT_WAYLAND_DISABLE_WINDOWDECORATION="${QT_WAYLAND_DISABLE_WINDOWDECORATION:-1}"
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"

          exec "$LAUNCHER" "$@"
          APPRUN_EOF
          chmod +x AppDir/AppRun

      - name: Bundle Fcitx5/IBus Qt6 input-method plugins
        run: |
          set -euo pipefail
          APPDIR="AppDir"
          # JetBrains Compose runtime ships Qt 6 plugins at
          # MuJing/lib/runtime/lib/plugins/ inside the unpacked distributable.
          QT_PLUGINS_DIR=$(find "$APPDIR/MuJing" -type d -path '*plugins' | head -n 1 || true)
          if [ -z "${QT_PLUGINS_DIR:-}" ]; then
            echo "::warning::Qt plugins dir not found; IME plugins will fall back to host at runtime."
          else
            mkdir -p "$QT_PLUGINS_DIR/platforminputcontexts"
            # Use the Fcitx5 Qt6 plugin pulled from the noble deb above.
            # IBus uses the system daemon via QT_IM_MODULE=ibus (no extra Qt
            # plugin file is needed in the AppImage).
            fcitx_plugin=$(find ime-extracted -name 'libfcitx5platforminputcontextplugin.so' | head -n 1 || true)
            if [ -n "${fcitx_plugin:-}" ]; then
              echo "Bundling $fcitx_plugin"
              cp -v "$fcitx_plugin" "$QT_PLUGINS_DIR/platforminputcontexts/"
            else
              echo "::warning::libfcitx5platforminputcontextplugin.so not found in extracted ime-extracted tree."
            fi
          fi

      - name: Run linuxdeploy to produce AppImage
        run: |
          set -euo pipefail
          export DEPLOY_DIR="$PWD/AppDir"
          # Export the embedded Qt path so linuxdeploy-plugin-qt finds the
          # Compose runtime's Qt libraries.
          export QML_SOURCES_PATHS=""
          ./tools/linuxdeploy-x86_64.AppImage \
            --appdir "$DEPLOY_DIR" \
            --desktop-file "$DEPLOY_DIR/MuJing.desktop" \
            --icon-file "$DEPLOY_DIR/MuJing.png" \
            --executable "$DEPLOY_DIR/MuJing/bin/MuJing" \
            --output appimage \
            --plugin qt
          ls -la *.AppImage

      - name: Rename and verify AppImage
        run: |
          set -euo pipefail
          set +e
          APPIMAGE_PATH=$(find . -maxdepth 2 -name '*.AppImage' -type f | head -n 1)
          set -e
          if [ -z "${APPIMAGE_PATH:-}" ] || [ "$APPIMAGE_PATH" = "." ]; then
            echo "::error::AppImage not produced by linuxdeploy."
            ls -la
            exit 1
          fi
          echo "AppImage produced at: $APPIMAGE_PATH"
          VERSION=$(grep '^version=' gradle.properties | head -n 1 | cut -d'=' -f2 | tr -d ' \r\n')
          TARGET="MuJing-${VERSION}-x86_64.AppImage"
          mv -v "$APPIMAGE_PATH" "$TARGET"
          chmod +x "$TARGET"
          file "$TARGET"
          ls -la "$TARGET"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuJing-linux-appimage-x86_64
          path: MuJing-*-x86_64.AppImage

  draft-release:
    name: Draft Release
    needs: appimage
    runs-on: ubuntu-22.04
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Get Tag
        id: get_tag
        run: |
          TAG=${{ github.ref_name }}
          VERSION=${TAG#v}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Draft Release
        uses: ncipollo/release-action@v1
        with:
          draft: true
          allowUpdates: true
          generateReleaseNotes: false
          name: ${{ env.TAG }}
          tag: ${{ env.TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ---
            ### Linux 版本下载
            - [Linux AppImage (x86_64)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-x86_64.AppImage)
            ### Windows 版本下载
            - [Windows 安装包 (MSI)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}.msi)
            - [Windows 绿色版 (ZIP)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}.zip)
            ### macOS 版本下载
            - [macOS x86_64 Intel 芯片(DMG)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-x64.dmg)
            - [macOS aarch64 M 芯片(DMG)](https://github.com/${{ github.repository }}/releases/download/${{ env.TAG }}/MuJing-${{ env.VERSION }}-aarch64.dmg)
          artifactErrorsFailBuild: false
          artifacts: "artifacts/**/*.AppImage,artifacts/**/*.msi,artifacts/**/*.zip,artifacts/**/*.dmg"
